<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="MLOps Pipeline — Kubeflow + DVC + Jenkins for California Housing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#334155"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="20" fill="url(#glow)"/>

  <!-- MOTIF: DAG / pipeline nodes — four connected stages -->
  <g transform="translate(980,190)" stroke="#93c5fd" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <!-- edges -->
    <line x1="-92" y1="-58" x2="-20" y2="0"/>
    <line x1="-20" y1="0" x2="-92" y2="58"/>
    <line x1="-20" y1="0" x2="64" y2="-46"/>
    <line x1="-20" y1="0" x2="64" y2="46"/>
    <!-- nodes -->
    <circle cx="-92" cy="-58" r="20"/>
    <circle cx="-92" cy="58" r="20"/>
    <circle cx="-20" cy="0" r="24"/>
    <circle cx="64" cy="-46" r="20"/>
    <circle cx="64" cy="46" r="20"/>
  </g>

  <!-- wordmark -->
  <text x="80" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">MLOps Pipeline</text>
  <text x="84" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#93c5fd">Kubeflow · DVC · Jenkins</text>
  <text x="84" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#f1f5f9">An end-to-end ML pipeline for California Housing regression.</text>
  <text x="84" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">KFP · DVC · Jenkins · Docker · scikit-learn · Random Forest</text>
</svg>
