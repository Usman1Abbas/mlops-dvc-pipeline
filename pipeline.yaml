        --metrics, /tmp/outputs/metrics/data]
      command:
      - sh
      - -c
      - (PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location
        'pandas' 'scikit-learn' 'joblib' || PIP_DISABLE_PIP_VERSION_CHECK=1 python3
        -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn' 'joblib'
        --user) && "$0" "$@"
      - sh
      - -ec
      - |
        program_path=$(mktemp)
        printf "%s" "$0" > "$program_path"
        python3 -u "$program_path" "$@"
      - "def _make_parent_dirs_and_return_path(file_path: str):\n    import os\n \
        \   os.makedirs(os.path.dirname(file_path), exist_ok=True)\n    return file_path\n\
        \ndef evaluate_model(test_data_path , \n                   model_path , \n\
        \                   metrics_path ):\n    import pandas as pd\n    import joblib\n\
        \    from sklearn.metrics import mean_squared_error, r2_score\n    import\
        \ json\n\n    print(\"Evaluating model...\")\n    df = pd.read_csv(test_data_path)\n\
        \    X_test = df.drop('target', axis=1)\n    y_test = df['target']\n\n   \
        \ model = joblib.load(model_path)\n    predictions = model.predict(X_test)\n\
        \n    mse = mean_squared_error(y_test, predictions)\n    r2 = r2_score(y_test,\
        \ predictions)\n\n    metrics = {\n        'mse': mse,\n        'r2': r2\n\
        \    }\n\n    with open(metrics_path, 'w') as f:\n        json.dump(metrics,\
        \ f)\n\n    print(f\"Metrics: {metrics}\")\n\nimport argparse\n_parser = argparse.ArgumentParser(prog='Evaluate\
        \ model', description='')\n_parser.add_argument(\"--test-data\", dest=\"test_data_path\"\
        , type=str, required=True, default=argparse.SUPPRESS)\n_parser.add_argument(\"\
        --model\", dest=\"model_path\", type=str, required=True, default=argparse.SUPPRESS)\n\
        _parser.add_argument(\"--metrics\", dest=\"metrics_path\", type=_make_parent_dirs_and_return_path,\
        \ required=True, default=argparse.SUPPRESS)\n_parsed_args = vars(_parser.parse_args())\n\
        \n_outputs = evaluate_model(**_parsed_args)\n"
